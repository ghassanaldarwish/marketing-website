name: Format GH-012 branch

on:
  push:
    branches:
      - fix/gh-012-reduced-motion
    paths:
      - .github/workflows/format-gh012.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gh-012-reduced-motion
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/hero/Hero.tsx src/components/ui/EncryptedText.tsx src/components/ui/FloatingNav.tsx src/components/ui/InfiniteMovingCards.tsx src/components/ui/Terminal.tsx src/components/ui/terminal-content.ts src/components/ui/terminal-content.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(format): apply repository formatting [GH-012]"
          git push origin HEAD:fix/gh-012-reduced-motion
