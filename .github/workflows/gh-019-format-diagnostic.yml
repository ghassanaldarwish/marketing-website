name: GH-019 format diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source files
        run: pnpm format

      - name: Capture formatted files
        run: |
          mkdir -p formatted/src/app/'[locale]' formatted/src/styles formatted/src formatted/tests/e2e
          cp src/app/'[locale]'/layout.tsx formatted/src/app/'[locale]'/layout.tsx
          cp src/mdx-components.tsx formatted/src/mdx-components.tsx
          cp src/styles/rtl-typography.css formatted/src/styles/rtl-typography.css
          cp tests/e2e/arabic-typography.spec.ts formatted/tests/e2e/arabic-typography.spec.ts
          git diff --check
          git diff > formatted/format.patch

      - name: Upload formatted output
        uses: actions/upload-artifact@v4
        with:
          name: gh-019-formatted-files
          path: formatted
          if-no-files-found: error
